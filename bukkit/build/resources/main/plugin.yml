name: ImmersivePortalsPaperized
version: 1.1.0
main: org.envel.immersiveportalspaperized.bukkit.ImmersivePortalsPaperized
description: "Plugin which allows nether portals to be seen through, and allows custom portal creation"
folia-supported: true
author: Envel
depend:
  - ProtocolLib
api-version: "1.21"
softdepend:
  - Multiverse-Core
  - My_Worlds
  - Vault
commands:
  immersiveportalspaperized:
    description: Main plugin command
    aliases:
      - bp
permissions:
  immersiveportalspaperized.createfromcoords:
    description: ' Allows you to use /bp createfromcoords'
    default: op
  immersiveportalspaperized.getname:
    description: ' Allows you to use /bp getname'
    default: op
  immersiveportalspaperized.link:
    description: ' Allows you to create portals with /bp link'
    default: op
  immersiveportalspaperized.linkexternal:
    description: ' Allows you to run /bp linkexternal to create cross-server portals.'
    default: op
  immersiveportalspaperized.removeclosest:
    description: ' Allows you to use /bp removeclosest'
    default: op
  immersiveportalspaperized.reload:
    description: ' Allows you to use /bp reload'
    default: op
  immersiveportalspaperized.create:
    description: ' Allows you to use /bp create'
    default: op
  immersiveportalspaperized.updatecoords:
    description: ' Allows you to use /bp updatecoords'
    default: op
  immersiveportalspaperized.tp:
    description: ' Allows you to use /bp tp'
    default: op
  immersiveportalspaperized.setprice:
    description: ' Allows you to use /bp setprice'
    default: op
  immersiveportalspaperized.setpreset:
    description: ' Allows you to use /bp setpreset'
    default: op
  immersiveportalspaperized.bypassprice:
    description: ' Allows you to bypass paying for custom portals.'
    default: op
  immersiveportalspaperized.admin:
    description: ' Allows you to bypass portal size restrictions, and see debug information.'
    default: op
  immersiveportalspaperized.createcustom:
    description: ' Allows you to use /bp createcustom'
    default: op
  immersiveportalspaperized.wand:
    description: ' Allows you to use /bp wand'
    default: op
  immersiveportalspaperized.user:
    description: ' Allows you to use portals'
    default: true
  immersiveportalspaperized.see:
    description: ' Allows you to see through portals'
    default: true
